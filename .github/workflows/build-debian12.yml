name: Build Debian 12 (native)

on:
  workflow_dispatch:

jobs:
  build-in-debian12:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
    steps:
      - name: Install Git and base tools
        run: |
          apt update
          apt install -y git ca-certificates curl gnupg

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Node.js 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt install -y nodejs

      - name: Install dependencies
        run: |
          apt install -y --no-install-recommends \
            build-essential cmake git pkg-config \
            libboost-all-dev libssl-dev \
            libavdevice-dev libavfilter-dev libavformat-dev libavcodec-dev \
            libswresample-dev libswscale-dev \
            libsdl2-dev libpulse-dev libopus-dev libvpx-dev \
            libx264-dev libx265-dev \
            libwayland-dev libdrm-dev libcap-dev libudev-dev libevdev-dev \
            qtbase5-dev qtbase5-private-dev qttools5-dev-tools \
            libcurl4-openssl-dev libminiupnpc-dev \
            libva-dev libva-drm2 libva-x11-2 \
            glslang-tools spirv-tools \
            libpipewire-0.3-dev \
            libayatana-appindicator3-dev libnotify-dev \
            doxygen graphviz \
            ninja-build \
            python3 python3-pip python3-jinja2 python3-setuptools

      - name: Patch config.h (add array header)
        run: |
          sed -i '/#include <unordered_map>/a #include <array>' src/config.h
          echo "config.h patched"

      - name: Remove all #include <format> from source files
        run: |
          # 查找并注释所有未被注释的 #include <format>
          find src/ -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) | while read file; do
            if grep -q '^[[:space:]]*#include[[:space:]]*<format>' "$file"; then
              echo "Patching $file"
              sed -i 's/^[[:space:]]*#include[[:space:]]*<format>/\/\/ &/' "$file"
            fi
          done
          # 验证没有残留的未注释 include
          if grep -r '^[[:space:]]*#include[[:space:]]*<format>' src/; then
            echo "ERROR: Some format includes remain"
            exit 1
          else
            echo "All format includes removed"
          fi

      - name: Force C++20 in CMakeLists.txt
        run: |
          sed -i 's/CMAKE_CXX_STANDARD 23/CMAKE_CXX_STANDARD 20/g' CMakeLists.txt
          echo "CMakeLists.txt patched to C++20"

      - name: Build Sunshine
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DCUDA_FAIL_ON_MISSING=OFF \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -G Ninja
          ninja -v -j$(nproc)

      - name: Create DEB package
        run: |
          cd build
          cpack -G DEB --config ./CPackConfig.cmake

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-debian12-native
          path: build/sunshine-*.deb
