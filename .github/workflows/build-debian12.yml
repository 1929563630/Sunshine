name: Build Debian 12 (bookworm)

on:
  workflow_dispatch:

jobs:
  build-debian12:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install all dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential cmake git pkg-config \
            libboost-all-dev libssl-dev libavdevice-dev libavfilter-dev \
            libavformat-dev libavcodec-dev libswresample-dev libswscale-dev \
            libsdl2-dev libpulse-dev libopus-dev libvpx-dev libx264-dev \
            libx265-dev libwayland-dev libdrm-dev libcap-dev libudev-dev \
            qtbase5-dev qtbase5-private-dev qttools5-dev-tools \
            libcurl4-openssl-dev libminiupnpc-dev

      - name: Build Sunshine
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DCUDA_FAIL_ON_MISSING=OFF
          make -j$(nproc)

      - name: Create DEB package
        run: |
          cd build
          sudo apt install -y checkinstall
          sudo checkinstall -y -D --install=no \
            --pkgname=sunshine \
            --pkgversion=2026.408.194927 \
            --pkgarch=amd64 \
            make install

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-debian12
          path: build/sunshine_*.deb
