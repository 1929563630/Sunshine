name: Build Debian 12 (native)

on:
  workflow_dispatch:

jobs:
  build-in-debian12:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
    steps:
      - name: Install Git and base tools
        run: |
          apt update
          apt install -y git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt install -y --no-install-recommends \
            build-essential cmake git pkg-config \
            libboost-all-dev libssl-dev \
            libavdevice-dev libavfilter-dev libavformat-dev libavcodec-dev \
            libswresample-dev libswscale-dev \
            libsdl2-dev libpulse-dev libopus-dev libvpx-dev \
            libx264-dev libx265-dev \
            libwayland-dev libdrm-dev libcap-dev libudev-dev libevdev-dev \
            qtbase5-dev qtbase5-private-dev qttools5-dev-tools \
            libcurl4-openssl-dev libminiupnpc-dev \
            libva-dev libva-drm2 libva-x11-2 \
            glslang-tools spirv-tools \
            libpipewire-0.3-dev \
            libayatana-appindicator3-dev libnotify-dev \
            doxygen graphviz \
            ninja-build \
            python3 python3-pip   # 添加这两行

      - name: Build Sunshine
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DCUDA_FAIL_ON_MISSING=OFF \
            -G Ninja
          ninja -j$(nproc)

      - name: Create DEB package
        run: |
          cd build
          cpack -G DEB --config ./CPackConfig.cmake

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-debian12-native
          path: build/sunshine-*.deb
