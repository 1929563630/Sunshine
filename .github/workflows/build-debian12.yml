name: Build Debian 12 (native)

on:
  workflow_dispatch:

jobs:
  build-in-debian12:
    runs-on: ubuntu-22.04
    container:
      image: debian:bookworm
    steps:
      - name: Install Git and base tools
        run: |
          apt update
          apt install -y git ca-certificates curl gnupg

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 修复 Git 权限错误（日志里的警告）
      - name: Fix git safe directory
        run: git config --global --add safe.directory /__w/Sunshine/Sunshine

      - name: Install Node.js 20
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
          apt install -y nodejs

      - name: Install dependencies
        run: |
          apt install -y --no-install-recommends \
            build-essential cmake git pkg-config \
            libboost-all-dev libssl-dev \
            libavdevice-dev libavfilter-dev libavformat-dev libavcodec-dev \
            libswresample-dev libswscale-dev \
            libsdl2-dev libpulse-dev libopus-dev libvpx-dev \
            libx264-dev libx265-dev \
            libwayland-dev libdrm-dev libcap-dev libudev-dev libevdev-dev \
            qtbase5-dev qtbase5-private-dev qttools5-dev-tools \
            libcurl4-openssl-dev libminiupnpc-dev \
            libva-dev libva-drm2 libva-x11-2 \
            glslang-tools spirv-tools \
            libpipewire-0.3-dev \
            libayatana-appindicator3-dev libnotify-dev \
            doxygen graphviz \
            ninja-build \
            python3 python3-pip python3-jinja2 python3-setuptools

      # 1. 禁用 C++23，强制使用 C++20
      - name: Force C++20
        run: |
          sed -i 's/CMAKE_CXX_STANDARD 23/CMAKE_CXX_STANDARD 20/g' CMakeLists.txt
          sed -i 's/set(CMAKE_CXX_STANDARD 23)/set(CMAKE_CXX_STANDARD 20)/g' CMakeLists.txt

      # 2. 移除所有 <format> 头文件
      - name: Remove #include <format>
        run: |
          find src/ -type f \( -name "*.cpp" -o -name "*.h" \) | xargs sed -i 's/^[[:space:]]*#include <format>/\/\/ &/'

      # 3. 核心修复：把 std::format 替换为 boost::format（项目已自带 Boost）
      - name: Replace std::format with boost::format
        run: |
          sed -i 's/std::format/boost::format/g' src/config.cpp
          sed -i 's/boost::format("\([^"]*\){\([^}]*\)}")/boost::format("\1%2%\") % \2/g' src/config.cpp

      - name: Build Sunshine
        run: |
          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_DOCS=OFF \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DCMAKE_CXX_STANDARD=20 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -G Ninja
          ninja -v

      - name: Create DEB package
        run: |
          cd build
          cpack -G DEB

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunshine-debian12
          path: build/sunshine-*.deb
